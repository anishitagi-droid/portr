name: CI
on:
  push:         { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  test:
    name: Test — Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # portr itself supports Node >=18 (see package.json engines) --
        # this matrix is narrower because vitest 4's own engines field is
        # ^20.0.0 || ^22.0.0 || >=24.0.0, and CI runs the test suite, not
        # just portr itself. Node 18 was in this matrix and failing before
        # this comment existed; verified vitest's actual requirement
        # directly (node_modules/vitest/package.json) rather than guessing
        # after the first attempt at this got it wrong.
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: npm ci
      - run: npm test
      - name: Smoke test
        run: |
          node src/index.js --version
          node src/index.js list --json
          node src/index.js check 1 --quiet; true
